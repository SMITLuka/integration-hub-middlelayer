server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integration_hub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

integration-hub:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  auth:
    # Bitrix MCP server acting as OpenID Connect provider (Bitrix24 login).
    issuer-uri: ${AUTH_ISSUER_URI:https://mcp.sm-it.hr}
    # This API's public URL; must equal INTEGRATION_HUB_API_URL on the MCP server. No default on purpose:
    # a missing value must stop the app from starting instead of silently rejecting every login.
    audience: ${AUTH_AUDIENCE}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.smit.integrationhubmiddlelayer: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
