server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/integration_hub}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

integration-hub:
  service-api:
    # API keys for the machine-to-machine API under /service/** (header X-Api-Key), comma separated.
    # Empty = the service API rejects every request.
    keys: ${SERVICE_API_KEYS:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  auth:
    # SMIT SSO gateway's public keys; users reach Integration Hub only through the SSO portal.
    jwks-uri: ${SSO_JWKS_URI:https://backend-production-5810.up.railway.app/.well-known/jwks.json}
    # ID (UUID) of the "Integration Hub" app registered in the SSO gateway; only tokens issued for it are
    # accepted. No default on purpose: a missing value must stop the app from starting instead of
    # silently rejecting every login. Who may do what is set per role in the SSO portal (see PermissionPolicy).
    app-id: ${SSO_APP_ID}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.smit.integrationhubmiddlelayer: INFO
    org.springframework: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
